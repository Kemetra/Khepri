name: governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true
          # Keep downloaded wheels. The default prune saves an empty cache, so every job
          # downloaded every dependency again, and two 10-minute jobs timed out doing it.
          prune-cache: false
      - run: uv sync --frozen
      - run: uv run khepri-gov validate

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true
          # Keep downloaded wheels. The default prune saves an empty cache, so every job
          # downloaded every dependency again, and two 10-minute jobs timed out doing it.
          prune-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .

  # A PostgreSQL service is attached because some contracts cannot be proved
  # without one. The RCA suite runs in-memory SQLite through a StaticPool, so
  # every session shares a single connection and two concurrent transactions
  # cannot exist; SQLite also has no SELECT ... FOR UPDATE, and SQLAlchemy
  # emits none for that dialect. A concurrency test written against that
  # fixture would pass while proving nothing.
  #
  # KHEPRI_TEST_DATABASE_URL is the only way a test reaches this service. A
  # test that needs it must skip when the variable is unset, so the suite
  # still runs locally on SQLite alone -- but see the guard job below: a skip
  # in CI is treated as a failure, because a skipped concurrency test reports
  # green and reads as a passing one.
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    # 25, not 10. `FND-005` puts the `browser`-marked tests on this job. Measured on
    # 2026-10-01 (run 36828729461), before the guards stopped re-running their subsets:
    #
    #   the full suite, 7171 tests                        13m20s
    # + the concurrency guard re-running 163 tests         1m33s
    # + the browser guard re-running 370 tests             6m08s
    # + `uv sync` and `playwright install --with-deps`     2-5m
    #                                                  ~= 23-25m, and #635 was cancelled at 25
    #
    # The guards now read the suite's own record (`marker_report.py`), which removes the
    # two re-runs. 25 stays, so the job keeps its margin as the suite grows.
    timeout-minutes: 25
    services:
      postgres:
        # Pinned by digest, matching how every action in this file is pinned.
        # postgres:17-alpine as of 2026-08-13.
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: khepri
          POSTGRES_PASSWORD: khepri
          POSTGRES_DB: khepri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khepri -d khepri_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KHEPRI_TEST_DATABASE_URL: postgresql+psycopg://khepri:khepri@localhost:5432/khepri_test
      # Where the suite records each marked test's outcome for the two guards below.
      KHEPRI_MARKER_REPORT: marker-report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true
          # Keep downloaded wheels. The default prune saves an empty cache, so every job
          # downloaded every dependency again, and two 10-minute jobs timed out doing it.
          prune-cache: false
      - run: uv sync --frozen
      # `FND-005`: without this the 236 `browser`-marked tests skip and the job reports
      # green. The lockfile is the pin -- `uv.lock` constrains playwright to >=1.61,<2 and
      # `playwright install` resolves the Chromium revision that version fixes. No revision
      # is transcribed here; `image.yml` remains the only place one is read out.
      - name: install the pinned Chromium
        run: uv run playwright install --with-deps chromium
      # `marker_report` records every `browser` and `concurrency` test's outcome, so the
      # guards below read this run instead of running those tests a second time.
      - name: run the suite
        env:
          PYTHONPATH: .github/scripts
        run: uv run pytest -p marker_report
      # The point of attaching the service is that concurrency contracts get
      # proved rather than skipped, and a skipped test reports green. This
      # step fails if any test marked `concurrency` was skipped, and also
      # fails if the marker matches nothing at all -- because "no concurrency
      # tests exist" and "the concurrency tests were silently disabled" look
      # identical from the outside, and only the second is a regression.
      - name: prove the concurrency contracts actually ran
        run: uv run python .github/scripts/require_concurrency_tests.py
      # The same reading for the browser contracts, which `FND-005` governs. This step
      # fails if any test marked `browser` was skipped -- meaning the Chromium install
      # above did not take -- and fails if the marker matches nothing at all, because a
      # renamed marker and an unwritten test are indistinguishable from outside.
      - name: prove the browser contracts actually ran
        run: uv run python .github/scripts/require_browser_tests.py

  # RRA-007 requires CI to fail when an approved performance tolerance is
  # exceeded. This job is that gate. It is NOT evidence that the objective is
  # met, and a green run of it must never be read as evidence:
  #
  #   * No approved benchmark workload exists. With the variables below unset --
  #     which is every run today -- the job reports "NOT CERTIFIED", measures no
  #     sample, tests no objective, and succeeds without asserting anything.
  #   * The variables are read from repository configuration, never from this
  #     file. A benchmark identifier, workload digest, environment digest, or
  #     approval reference written here would fabricate approval evidence.
  #   * Once they are supplied, the job BLOCKS until a benchmark runner for the
  #     approved environment is wired in. An approved objective nobody measured
  #     must not read as an objective that held; that failure is Constitution V
  #     working, not a regression.
  #   * A declaration that is partly supplied, blank, or unreadable also blocks.
  benchmark:
    name: benchmark (certifies nothing without an approved workload)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KHEPRI_BENCHMARK_ID: ${{ vars.KHEPRI_BENCHMARK_ID }}
      KHEPRI_BENCHMARK_WORKLOAD_DIGEST: ${{ vars.KHEPRI_BENCHMARK_WORKLOAD_DIGEST }}
      KHEPRI_BENCHMARK_ENVIRONMENT_DIGEST: ${{ vars.KHEPRI_BENCHMARK_ENVIRONMENT_DIGEST }}
      KHEPRI_BENCHMARK_APPROVAL_REF: ${{ vars.KHEPRI_BENCHMARK_APPROVAL_REF }}
      KHEPRI_BENCHMARK_SAMPLE_COUNT: ${{ vars.KHEPRI_BENCHMARK_SAMPLE_COUNT }}
      KHEPRI_BENCHMARK_DATASET_ROWS: ${{ vars.KHEPRI_BENCHMARK_DATASET_ROWS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true
          # Keep downloaded wheels. The default prune saves an empty cache, so every job
          # downloaded every dependency again, and two 10-minute jobs timed out doing it.
          prune-cache: false
      - run: uv sync --frozen
      - name: enforce the approved completion objective, or certify nothing
        run: uv run python -m khepri.rra.benchmark_gate
