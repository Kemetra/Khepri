# The local development stack. Not a deployment, and not a target selection.
#
# This file stands up PostgreSQL and an S3-compatible endpoint on a developer's
# machine so the journey can be run. It is named `.local` so it can never be
# mistaken for a provisioned environment, and nothing it produces is benchmark,
# residency, or approval evidence.
#
# **This stack names no cloud provider, and that is the point.** `KHEPRI-DEC-027`
# selects DigitalOcean FRA1 as the target direction while explicitly reserving the
# concrete product selections as an unresolved stop-gate. MinIO below is a local
# development choice and pre-empts none of it: `khepri.rra.storage` states that
# there is no provider branch and must never be one, so what runs here differs from
# any target only in endpoint and credentials.
#
# **Why MinIO now, when the file previously argued it was unusable.** The store used
# to prove its policy by reading `ServerSideEncryption`, `SSEKMSKeyId`, and
# `BucketKeyEnabled` off the `PutObject` response, which MinIO cannot satisfy --
# it rewrites the key identifier to a form carrying neither region nor account.
# That is still true and no longer matters: `KHEPRI-DEC-008` moved encryption into
# the application, so the bytes are already ciphertext when they leave the process
# and `_write_is_unversioned` now checks only the echoed checksum and the absence
# of a `VersionId`. The required surface is put, get, delete, list, abort multipart,
# and `IfNoneMatch`. LocalStack was here to supply a KMS nothing asks for any more.
#
# **The credentials are load-bearing.** `khepri.local.config` sends `test`/`testtest`
# and MinIO, unlike LocalStack, rejects anything but its configured root user, so
# these two values must match that module. MinIO also requires a secret of at least
# eight characters, which is why the secret is not simply `test`.
#
# **The bucket is created unversioned** by `ensure_local_bucket`, and MinIO does not
# version by default. `RRA-002` requires deletion to actually delete rather than
# leave a recoverable prior version behind, and the store rejects any response
# carrying a `VersionId`.
#
# **Docker-in-WSL note (Windows).** A container started from a one-shot
# `wsl -- bash -lc ...` receives SIGTERM when that WSL session ends, because WSL
# stops the distribution once its last process exits. Keep a long-lived WSL process
# open, or start the stack from a shell that stays open.
#
#   docker compose -f docker-compose.local.yml up -d
#   uv run alembic upgrade head
#   uv run python -m khepri.local.cli invite
#   uv run uvicorn khepri.local.app:app --reload
#   uv run python -m khepri.local.cli work

# Compose derives a project name from the directory, so without this both compose
# files claim the same project and starting one stack recreates the other's
# containers. The staging stack sets its own.
name: khepri-local

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: khepri-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khepri
      POSTGRES_PASSWORD: khepri
      POSTGRES_DB: khepri
    # Host port 15432 rather than 5432: it is what `DEFAULT_DATABASE_URL` in
    # `khepri.local.config` points at, and it leaves a system PostgreSQL alone.
    # Bound to loopback. Compose's short syntax omits the host IP and publishes on
    # every interface, which would put a fixed-credential database on the LAN of
    # any machine this runs on.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - khepri-local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khepri -d khepri"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3 only. There is no KMS service here and no key: encryption is the
  # application's own work under `KHEPRI-DEC-008`.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: khepri-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Must match `LocalSettings.access_key` and `.secret_key`, which read
      # `KHEPRI_LOCAL_ACCESS_KEY` and `KHEPRI_LOCAL_SECRET_KEY` from the
      # environment. Substituting the same two names means overriding them moves
      # the client and the server together; hardcoding the defaults would make an
      # override 403 every call while looking like a network fault.
      #
      # **Set these by exporting them, never in a project `.env`.** Compose
      # interpolates from a `.env` beside the compose file automatically, while
      # `LocalSettings` reads `os.environ` only, so a credential written there
      # configures MinIO and never reaches a `uv run` client -- the same split this
      # substitution exists to close, arriving through a different door. There is
      # no `.env` in this repository and `.gitignore` keeps it that way; if one is
      # ever added for other purposes, run compose with `--env-file /dev/null` or
      # export these two alongside it.
      #
      # `-` and not `:-`, which is the whole point. `${VAR:-default}` substitutes
      # when the variable is unset OR empty, while `os.environ.get(name, default)`
      # substitutes only when it is unset -- so with `KHEPRI_LOCAL_ACCESS_KEY=`
      # exported, the client would send `''` and the server would be configured
      # with `test`, recreating the divergence this substitution exists to remove.
      # `-` matches Python's semantics exactly, so an empty override reaches both
      # sides and MinIO refuses to start rather than the mismatch surfacing later
      # as a 403.
      MINIO_ROOT_USER: ${KHEPRI_LOCAL_ACCESS_KEY-test}
      MINIO_ROOT_PASSWORD: ${KHEPRI_LOCAL_SECRET_KEY-testtest}
    # 14566 is inherited from the endpoint `DEFAULT_S3_ENDPOINT` already names; it
    # is not a LocalStack remnant, and changing it would mean editing that default
    # and everything asserting it. 19001 is the browser console, which nothing reads.
    ports:
      - "127.0.0.1:14566:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - khepri-local-miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  khepri-local-pgdata:
  khepri-local-miniodata:
