schema_version: 1
id: APP-020
title: Commercial identity, organizations, and authorization specification approved
state: approved
owner: AHMED-SHAABAN
scope: >-
  Approve RCA-001, the first specification in the RCA family, which fixes durable accounts,
  credentials, authentication sessions, recovery, organizations, memberships, invitations, roles,
  and the authorization records over them, and fixes the bridge by which an authorized commercial
  context resolves to the opaque isolation scope the RRA specifications already govern. Approval
  settles what the specification requires. It authorizes no implementation: of the four
  implementation preconditions RCA-001 states, this package satisfies precondition 1 only,
  KHEPRI-DEC-015 satisfied precondition 3 at APP-018, and preconditions 2 and 4 remain unmet.
  Precondition 2 is the binding one, because KHEPRI-DEC-008 is proposed and no runtime or provider
  is settled. The two passages that named the specification's own draft state were corrected before
  approval so the document does not contradict the registry it points at.
exclusions:
  - Any change to governance/CONSTITUTION.md or the authorities registry
  - Any delegation record, including DEL-006 which this package cites, and any widening of its
    scope or expiry
  - Any product application code; RCA-001 implementation requires preconditions 2 and 4, both unmet
  - Any transition or approval of KHEPRI-DEC-008, which remains proposed and gates deployment
  - Any deployment, provisioning, provider selection, runtime choice, or spending authorization
  - Any advance of RCA-001 beyond approved, and any implemented or verified claim
  - Any weakening of RRA-001, RRA-002, or RRA-006 isolation, privacy, or deletion controls
  - Any retention authority beyond KHEPRI-DEC-015, whose scope is commercial identity only
  - Any change to RRA-002 retail-content intake, retention, or deletion, which is unchanged
  - Any account or organization deletion capability, which RCA-001 excludes
  - Any authorization of billing, subscriptions, quotas, invoicing, or payment records
  - Any authorization of agency portfolios, client switching, delegated access, or recurring
    delivery
  - Any authorization of marketing, profiling, product analytics, or AI use of retained data
  - Any authorization of persistent workspaces, report history, or multi-dataset storage
  - Any Seshat-BI integration or database connector credentials
  - Any claim that the withdrawn commercial-validation gate was satisfied, or that the commercial
    thesis behind the phase ordering has been tested
  - Any claim that a human authority approved this package
