schema_version: 1
id: APP-022
title: RRA family charter renewal replacing a self-disarming implementation exclusion
state: approved
owner: AHMED-SHAABAN
scope: >-
  Renew the RRA family charter at active, correcting one passage that the family's own progress
  made vacuous. The charter excluded "Product implementation while this family's specifications
  remain draft". RRA is active and all nine of its specifications are approved, with none in draft,
  so that condition is false and the exclusion stopped excluding anything at the exact moment it
  was needed. It is replaced by an exclusion stated against the governing specification's
  implementation preconditions, which are real gates rather than lifecycle states, and which
  approval does not clear. This is the same defect APP-021 corrected in the RCA charter, in the
  same words, and it survived undetected in the sibling charter because nothing checked for the
  shape. The lifecycle-guard added alongside this renewal is what found it. A second Excludes
  entry, "Runtime or provider selection before a separate architecture decision is accepted", is
  annotated rather than rewritten: acceptance of that decision is the intended gate rather than an
  incidental state, so the exclusion is discharged by the decision that authorizes the selection
  rather than disarmed by an unrelated transition. It carries an inline lifecycle-ok annotation
  recording that reasoning, which the guard reports rather than suppresses silently. Nothing else
  in the charter changes; no Owns entry, no other Excludes entry, and no boundary against RCA or
  FND is touched.
exclusions:
  - Any change to governance/CONSTITUTION.md or the authorities registry
  - Any delegation record, and any widening of a delegation's scope or expiry
  - Any advance or retreat of the RRA family beyond active; the state is unchanged on both sides
  - Any change to the charter's Owns section, or to any Excludes entry other than the two passages
    named in scope
  - Any transition or approval of any RRA specification, all nine of which remain approved and
    unchanged
  - Any product application code; this renewal restores an exclusion rather than relaxing one
  - Any authorization to implement any RRA specification
  - Any transition or approval of KHEPRI-DEC-008, which remains proposed and gates deployment
  - Any deployment, provisioning, provider selection, runtime choice, or spending authorization
  - Any weakening of the privacy, isolation, validation, reconciliation, provenance, language
    parity, or deletion controls that RRA-001, RRA-002, and RRA-006 fix
