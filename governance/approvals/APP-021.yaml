# Approved under DEL-007, the standing delegation recorded on 2026-08-10 and merged at 5373566.
# When this package was authored it stated that DEL-006 did not reach a family charter and that
# owner approval was therefore required. That was true of DEL-006, whose scope enumerated eleven
# artifact identifiers and named no charter. DEL-007 supersedes that enumeration with the wildcard
# scope, and a family charter is not in the Article VIII reserved set, so the authority now exists
# where it did not. The digest below is the one this package has carried unchanged since it was
# authored, and governance/families/RCA.md still hashes to the document_sha256 pinned in artifacts.
#
# Constitution VIII requires a delegated approval record the DELEGATE's identifier and never the
# human authority's, so approved_by is KHEPRI-AGENT and not AHMED-SHAABAN.
