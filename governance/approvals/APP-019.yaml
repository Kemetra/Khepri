schema_version: 1
id: APP-019
title: RRA-009 renewal correcting the customer-facing refusal catalogue counts
state: approved
owner: AHMED-SHAABAN
scope: >-
  Renew RRA-009 at approved, correcting the two passages whose counts no longer describe the
  implemented catalogue. The approved text stated "eight section reasons and five result reasons,
  being thirteen messages over eleven distinct codes" under "### Refusals", and "all thirteen
  refusal messages present in both languages" under "## Verification"; the shipped catalogue is
  eight section reasons and seven result reasons, being fifteen messages over thirteen distinct
  codes. The Verification clause is rewritten to enumerate the catalogue from the constant sets
  rather than to carry any count at all. The
  divergence is additive and arrived through approved slices: `ambiguous_mapping` came with the
  RRA-004 mapping work and `negative_base` with the RRA-008 comparison work, each adding a result
  reason and its bilingual prose. Every other claim in the paragraph was and remains true,
  including that exactly two codes appear in both contexts. The renewal also restates the
  requirement as total coverage of the catalogue as implemented rather than a fixed count, and
  names the two constant sets as the source of truth, so a later slice that adds a governed reason
  code cannot leave this specification quietly false again. Nothing else in RRA-009 changes and no
  implementation is authorised.
exclusions:
  - Any change to governance/CONSTITUTION.md or the authorities registry
  - Any delegation record, including DEL-006 which this package cites, and any widening of its
    scope or expiry
  - Any advance of RRA-009 beyond approved; the state is unchanged on both sides of the renewal
  - >-
    Any change to RRA-009 outside the two passages that carry the stale counts, being the
    refusal-catalogue bullet under "### Refusals" and the refusal-message clause under
    "## Verification". The Verification sentence said "all thirteen refusal messages present in
    both languages", the same falsehood a second time, three lines from the new rule forbidding
    uncomputable counts. Correcting one and leaving the other would have left the renewal failing
    at its own stated purpose.
  - Any new figure, aggregate, analysis family, metric, chart kind, or reason code
  - Any removal, renaming, or re-spelling of an existing governed reason code
  - Any product application code, and any claim that code must change; the code is correct and the
    specification was stale
  - Any transition or approval of RCA-001 or KHEPRI-DEC-015, which are separate packages
  - Any transition or approval of KHEPRI-DEC-008, which remains proposed
  - Any deployment, provisioning, provider selection, or spending authorization
  - Any claim that the withdrawn commercial-validation gate was satisfied
  - Any claim that a human authority approved this package
