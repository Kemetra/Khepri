schema_version: 1
id: APP-024
title: Accept the portable runtime decision and supersede the provider-specific architecture
state: proposed
owner: AHMED-SHAABAN
scope: >-
  Accept KHEPRI-DEC-008, replacing the provider-specific runtime architecture with a
  provider-neutral capability contract, and move KHEPRI-DEC-005 and KHEPRI-DEC-007 to superseded
  naming KHEPRI-DEC-008 while each retains its own approval evidence. This package authorizes the
  portability work KHEPRI-DEC-008 already defines and nothing beyond it. It selects no provider,
  no region, and no residency commitment, and it authorizes no provisioning, no deployment, no
  spending, and no beta launch -- KHEPRI-DEC-008 disclaims each of those in its own words, and the
  target-selection artifact it mandates is a separate reserved artifact that this package neither
  contains nor approves.
exclusions:
  - Any change to governance/CONSTITUTION.md or the authorities registry
  - Any delegation record, and any widening of a delegation's scope or expiry
  - Selection of a provider, region, or residency commitment, which the separately approved
    target-selection artifact KHEPRI-DEC-008 mandates is the only place to record
  - Any provisioning, deployment, environment creation, or beta launch authorization
  - Any spending authorization or financial commitment
  - Any retention, privacy, or data-boundary change under Constitution VII
  - Any RCA or RRA specification, and any product application code
  - Any claim that RCA-001 becomes implementable on this package alone; its precondition 4 and
    the target-selection artifact remain outstanding
  - Any edit to the prose of KHEPRI-DEC-005, whose document digest APP-013 binds and whose stale
    closing sentence requires its own renewal package
  - Any claim that the withdrawn commercial-validation gate was satisfied
  - Any claim that a human authority approved this package, absent that authority's evidence
