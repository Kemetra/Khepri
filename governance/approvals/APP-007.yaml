schema_version: 1
id: APP-007
title: Governed lifecycle transitions approval
state: proposed
owner: AHMED-SHAABAN
scope: >-
  Approve FND-002 exactly as digested, admitting a closed set of lifecycle transitions per
  registry, requiring every authority-ending transition to cite the approval it supersedes,
  and recording supersession in the authoritative registry rather than in prose.
exclusions:
  - Any product application code, product family, or product specification
  - Any new lifecycle state; every state FND-002 names is already defined and merely unreachable
  - Any judgement about which artifacts ought to be superseded or retired
  - Any grant of authority to automation to approve, propose, or decide a supersession
  - Materialization of KHEPRI-DEC-008, which requires its own package once this one is implemented
  - Any claim that the transitions FND-002 describes have been implemented
  - Any claim that technical review or automation is human approval
