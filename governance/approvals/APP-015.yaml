schema_version: 1
id: APP-015
title: Transformation and orchestration tooling boundary accepted
state: approved
owner: AHMED-SHAABAN
scope: >-
  Accept KHEPRI-DEC-012, settling that neither dbt nor Dagster is adopted into
  Khepri, that Khepri's transformation stack remains Polars in process and its
  job delivery remains PostgreSQL claim and redrive, and that Seshat-BI's
  governed dbt and Dagster adapters stay where they are with Khepri consuming
  neither.
exclusions:
  - Any change to governance/CONSTITUTION.md or the authorities registry
  - Any delegation record, including DEL-005 which this package cites
  - Any widening of DEL-005, whose scope and expiry this package cannot alter
  - Any code change in Khepri or in Seshat-BI, which this decision does not authorize
  - Any transition of KHEPRI-DEC-005, KHEPRI-DEC-007, KHEPRI-DEC-008 or KHEPRI-DEC-013
  - Any amendment of RRA.md, any specification, or any family charter
  - Any decision about a versioned analytical contract with Seshat-BI, which
    KHEPRI-DEC-012 explicitly declines to reach
  - Any claim that a human authority approved this package
