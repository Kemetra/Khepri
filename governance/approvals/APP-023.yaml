schema_version: 1
id: APP-023
title: Reserved set by consequence, narrowing what a delegation may reach
state: approved
owner: AHMED-SHAABAN
scope: >-
  Accept KHEPRI-DEC-016, which adds a category to the Article VIII reserved set and gives that set a
  machine-checkable representation. The reserved set is currently defined by artifact class, which
  does not track what a mistake costs: a family charter typo and an authorization to move customer
  data across a boundary are both outside it, so both may be approved by KHEPRI-AGENT under
  DEL-007. The first is revertible; the second is not revertible at all. This decision moves
  deployment, spending, provider or runtime selection, and privacy, retention, and data-boundary
  changes into the reserved set, recorded as a consequence field on each decision and specification
  registry entry, with a missing or unrecognised value treated as reserved rather than exempt. This
  narrows what a delegate may approve and removes nothing from the reserved set. Attribution,
  bootstrap containment, the ninety-day standing maximum, and immediate unilateral revocation are
  restated word for word and are unchanged. The specification that motivated this decision also
  proposed removing the approval package for artifacts outside the reserved set; that proposal is
  withdrawn on constitutional grounds, is not carried by this package, and is recorded as withdrawn
  in the decision's Context.
exclusions:
  - Any removal from the reserved set, or any relaxation of what a delegate may reach; this
    decision moves in one direction only
  - Any change to Articles I through VII, the lifecycle vocabularies, or the closing paragraph
  - Any change to the attribution rule; delegated approvals continue to record KHEPRI-AGENT and
    never a human identifier
  - Any change to bootstrap containment, the ninety-day standing maximum, or the revocation rule,
    each of which is restated verbatim
  - Any authority for automation to transition an artifact without an approval act, which Article
    II forecloses and which this package does not carry
  - Any change to any delegation record, including DEL-007's scope or expiry
  - Any change to governance/registries/authorities.yaml
  - Any transition or approval of KHEPRI-DEC-008, which remains proposed and gates deployment
  - Any deployment, provisioning, provider selection, runtime choice, or spending authorization
  - Any product application code, and any authorization to implement any specification
  - Any retroactive effect; no approval already recorded is invalidated, reopened, or rewritten
manifest_digest: sha256:c4b66f8d687d8dd055d43e5937ffcd0ec339609bd28e4f1b8500056baa7eab9a
# Approved by the human authority directly. This package amends the constitution,
# which Article VIII reserves and which no delegation reaches, so KHEPRI-AGENT
# could not approve it and did not.
#
# The evidence has a known limitation, recorded here rather than omitted. The
# comment at evidence_ref was posted by the GitHub account `Kemetra`, which
# KHEPRI-DEC-010 documents as the credential the automation also authenticates
# through. The repository therefore cannot distinguish, by inspection, a comment
# the owner typed from one this delegate could have produced. The delegate raised
# that limitation before transcribing and asked for a comment from the owner's
# personal account; the owner instead confirmed authorship in session
# 128b7625-b462-4866-af33-75cedee09933, stating "the Kemetra comment was me".
#
# That confirmation is itself an attestation the repository cannot verify, and
# this comment exists so a later reader is not misled into believing the evidence
# is stronger than it is. KHEPRI-DEC-010 already accepted this class of
# unverifiability as the cost of the current credential arrangement, and records
# that restoring the owner's signing key is the only mechanism that would remove
# it. The owner has declined signing keys. Approving on this evidence is the
# owner's decision, taken knowingly.
approval:
  approved_by: AHMED-SHAABAN
  approved_at: 2026-08-10
  approved_manifest_digest: sha256:c4b66f8d687d8dd055d43e5937ffcd0ec339609bd28e4f1b8500056baa7eab9a
  evidence_ref: https://github.com/Kemetra/Khepri/pull/140#issuecomment-5242942520
artifacts:
  # This package amends governance/CONSTITUTION.md, which Article VIII places in
  # the reserved set and which is_reserved_file() blocks unconditionally. No value
  # of a delegation's scope reaches it, so KHEPRI-AGENT may not approve this
  # package and it carries NO approval block. That is bootstrap containment as
  # KHEPRI-DEC-010 clause 7 states it: an authority that can widen its own
  # authority is unbounded regardless of how narrowly it begins.
  #
  # The direction of this amendment does not change that. It narrows what the
  # delegate may reach rather than widening it, but a delegate approving any
  # change to the reserved set would be deciding the boundary of its own
  # authority, and the record could not distinguish a narrowing it chose from a
  # widening it chose. AHMED-SHAABAN must approve it directly.
  - id: KHEPRI-DEC-016
    document: governance/decisions/KHEPRI-DEC-016-reserved-set-by-consequence.md
    document_sha256: sha256:b88a3fb51ca364c91ca1f48662771bd34144ae3e8276d18cc16542943f6a4d56
    from_state: proposed
    to_state: accepted
