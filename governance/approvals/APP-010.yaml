schema_version: 1
id: APP-010
title: Spoken delegation decision
state: proposed
owner: AHMED-SHAABAN
scope: >-
  Accept KHEPRI-DEC-010, adopting spoken delegation to a named non-human
  authority under mandatory machine attribution, a closed reserved set, session
  default scope, immediate revocation, and fail-closed enforcement, and withdraw
  KHEPRI-DEC-009 as rejected.
exclusions:
  - Any amendment to governance/CONSTITUTION.md, which this package does not carry
  - Any change to governance/registries/authorities.yaml or the KHEPRI-AGENT record
  - Any specification, schema, or validator implementing the delegation record
  - Any delegation record, which none of this package authorizes
  - Any approval performed under delegation, which is inoperative until implemented
  - Any transition or approval of KHEPRI-DEC-008
  - Any claim that a delegation record is cryptographic proof of an instruction
  - Any claim that the drafting delegate is a neutral judge of its own authority
