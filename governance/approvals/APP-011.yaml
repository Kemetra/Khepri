schema_version: 1
id: APP-011
title: Delegation machinery
state: approved
owner: AHMED-SHAABAN
scope: >-
  Accept KHEPRI-DEC-011, stating the complete replacement text of constitution
  articles II and VIII and the authorities registry change, and approve FND-003,
  specifying the delegation record schema, mandatory delegate attribution,
  reserved-set enforcement, and fail-closed validation that KHEPRI-DEC-010
  requires.
exclusions:
  - Any edit to governance/CONSTITUTION.md, which this package authorizes but does not perform
  - Any edit to governance/registries/authorities.yaml or creation of the KHEPRI-AGENT document
  - Any validator implementation, which FND-003 specifies and does not build
  - Any delegation record, which requires a human instruction that has not been given
  - Any approval performed under delegation, which no delegation yet permits
  - Any grant of authority to KHEPRI-AGENT, since registration alone grants nothing
  - Any transition or approval of KHEPRI-DEC-008
  - Any claim that a delegation record is cryptographic proof of an instruction
  - Any claim that FND-003 is implemented or verified rather than approved
