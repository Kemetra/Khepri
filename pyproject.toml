[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khepri-governance"
version = "0.1.0"
description = "Governance validation tooling for the Khepri platform."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.16.4,<2",
    # `botocore` and `pydantic` are imported directly -- `botocore.config.Config` in
    # `khepri.runtime.wiring` and `BaseModel`/`ConfigDict`/`StringConstraints` in the two API
    # modules -- and both would otherwise arrive only transitively, through boto3 and FastAPI.
    # KHEPRI-DEC-008 names Pydantic as the application-boundary schema library, so the boundary
    # schemas depend on a package no manifest pinned. A transitive resolution that works today is
    # not a pin: a FastAPI or boto3 release is free to drop either one.
    "boto3>=1.43.58,<2",
    "botocore>=1.43.58,<2",
    "clerk-backend-api>=7,<8",
    "fastapi>=0.116,<1",
    "fastexcel>=0.12,<1",
    "jinja2>=3.1,<4",
    "playwright>=1.61,<2",
    "polars>=1.0,<2",
    "psycopg[binary]>=3.2.9,<4",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy>=2.0.43,<3",
    "uvicorn[standard]>=0.35,<1",
    "xlsxwriter>=3.2,<4",
]

[project.scripts]
khepri-gov = "khepri_gov.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pypdf>=6,<7",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
# KHEPRI-DEC-005 makes AWS CDK v2 the definition of reproducible infrastructure. It is kept out
# of `project.dependencies` deliberately: the pinned OCI image that decision authorizes runs the
# web and worker services, and infrastructure tooling has no business inside it.
infra = [
    "aws-cdk-lib>=2.262,<3",
]

[tool.uv]
default-groups = ["dev", "infra"]

[tool.hatch.build.targets.wheel]
packages = ["src/khepri", "src/khepri_gov"]
# `khepri.local` is development wiring and is kept OUT of the built wheel, which is
# what the OCI image installs. The Dockerfile passes no CMD deliberately -- "a
# default here would silently make this image one of those two roles" -- and
# shipping a module exposing `khepri.local.app:app` and a `khepri-local` command
# would hand the image exactly the two entry points that discipline withholds. It
# also carries local database credentials, which have no business in a published
# artifact. An editable install of the checkout still has it, so local development
# is unaffected.
exclude = ["src/khepri/local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
cache_dir = ".pytest-cache"
markers = [
    "browser: exercises a real pinned Chromium; skipped when it is not installed (deselect with -m 'not browser')",
    "local_stack: exercises the docker-compose.local.yml stack; skipped when it is not running (deselect with -m 'not local_stack')",
    "concurrency: proves a contract that only a real database can exhibit; CI fails if one of these skips (deselect with -m 'not concurrency')",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
