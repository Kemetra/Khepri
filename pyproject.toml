[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khepri-governance"
version = "0.1.0"
description = "Governance validation tooling for the Khepri platform."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
khepri-gov = "khepri_gov.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/khepri", "src/khepri_gov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
cache_dir = ".pytest-cache"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
